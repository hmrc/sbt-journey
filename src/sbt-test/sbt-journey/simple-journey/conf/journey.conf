serviceName: simple-journey

indexPage: index

rootPages {
  index {viewRoute = "/"}
  beforeYouBegin {}
  # checkYourAnswers {}
}

models {
  AuditEvent: [
    {auditType: String},
    {description: String},
    {expectedGoLiveDate: LocalDate}
  ]
  TaxRegime: [SA, VAT]
}

journeys {
  submission {
    pages {
      cipAssessmentTicket {
        answerType = String
      }
      cipAssessmentPage {
        answerType = String
      }
      serviceName {
        answerType = String
      }
      serviceDescription {
        answerType = String
      }
      dataDomain {
        answerType = String
      }
      addATaxRegime {
        answerType = Boolean
      }
      taxRegime {
        answerType = String
      }
      whichTaxRegime {
        answerType = TaxRegime
      }
      vatInfo {
        answerType = String
      }
      saInfo {
        answerType = String
      }
      addAnotherTaxRegime {
        answerType = Boolean
      }
      auditProvider {
        answerType = String
      }
      auditSource {
        answerType = String
      }
      auditEvent {
        answerType = AuditEvent
      }
      addAnotherAuditEvent {
        answerType = Boolean
      }
      addAnotherAuditSource {
        answerType = Boolean
      }
    }

    # journeys take 4 forms
    # 
    # cipAssessmentTicket                                   a plain page from the `pages` above
    # {if: addATaxRegime, then: ...}                        an answerType = Boolean choice page followed by a subjourney - an optional subjourney
    # {do: ..., while: addAnotherTaxRegime}                 a subjourney followed by an answerType = Boolean choice page - a loop
    # {switch: whichTaxRegime, case { SA: ..., VAT: ... }}  an enum choice page followed by the split subjourneys that depend upon that choice
    #
    # navigation decisions are generated by using this structure to determine where to go next
    #
    # optional subjourneys skip the subjourney if the leading boolean choice page is answered negatively
    # looping subjourneys add to the answer list and skip back to the first part of the subjourney if the boolean choice page is answered positively

    # using the CIP assessment YAML as an example, with some made-up stuff added to illustrate the possibilities
    journey = [
      cipAssessmentTicket,
      cipAssessmentPage,
      serviceName,
      serviceDescription,
      dataDomain,
      {if: addATaxRegime, then: {do: taxRegime, while: addAnotherTaxRegime, as: taxRegimes}},
      {switch: whichTaxRegime, case: {SA: saInfo, VAT: vatInfo}},
      auditProvider,
      {do: [auditSource, {do: auditEvent, while: addAnotherAuditEvent, as: auditEvents}], while: addAnotherAuditSource, as: auditSources},
      # checkYourAnswers
    ]
    # Mapping journeys to user answers:
    # * Plain page          - produces an answer of the page's `answerType`
    # * Optional subjourney - produces an answer of the optional subjourney's answerTypes, wrapped an enum named after the choice page
    # * Looping subjourney  - produces an answer of the looping subjourney's answerTypes, wrapped in a List
    #
    # What happens when there is more than one answer under the optional or looping subjourney? We create a case class to represent the answers of the subjourney.
    #
    # For the journey above, UserAnswers contains optional keys:
    # {
    #   cipAssessmentTicket: String
    #   cipAssessmentPage: String
    #   serviceName: String
    #   serviceDescription: String
    #   dataDomain: String
    #   addATaxRegime: JsObject // ultimately AddATaxRegime
    #   whichTaxRegime: JsObject // ultimately WhichTaxRegime
    #   auditProvider: String
    #   auditSource: JsArray // ultimately List[AuditSource]
    #   // checkYourAnswers is one of the rootPages, not a journey page
    # }
    #
    # // This allows us to distinguish between "No" and "didn't answer" because "didn't answer" is a missing key in UserAnswers
    # // Note that this approach also provides "cleanup" by default, because changing "Yes" to "No" overwrites previous answers.
    # enum AddATaxRegime {
    #   case Yes(taxRegime: List[String])
    #   case No
    # }
    #
    # // Note that this approach also provides "cleanup" by default, because changing e.g. "SA" to "VAT" overwrites previous answers.
    # enum WhichTaxRegime {
    #    case SA(saInfo: String)
    #    case VAT(vatInfo: String)
    # }
    #
    # // We create this `AuditSource` class for the last journey part because the looping subjourney has more than a single question.
    # // Coming up with naming for this class is an interesting problem because we don't want it to collide with user-defined models.
    # case class AuditSource(auditSource: String, auditEvent: List[AuditEvent])
    #
    # Needs thought:
    # * When a journey page is reused in two different forks of a split journey, how does the controller know where to save answers?
    #
    # * The controller needs some form of context as to where it is in the journey, either via path params or checking previous answers.
    #
    # * We could disallow reusing pages at different splits in the journey. This is inconvenient but avoids this knotty issue.
    #
    # * Or, generate new controllers, page objects and forms for each occurrence of the "page" in each subjourney. Now we don't have this problem at the cost of code duplication.
    #
    # * Or, page objects could be responsible for constructing the answer path from the full context of the journey rather than holding a hardcoded JsPath.
    #
    # * 1st approach:
    #   Page objects could be responsible for constructing the answer path from the current UserAnswers.
    #   This allows us to generate the answer path based upon the known structure of the journey and how the user has answered so far.
    #
    # * 2nd approach:
    #   Pass the current "context path" (i.e. parent indices and enum choices) into the route via path params.
    #   Pass these to a Page object `apply` method to derive the answer JsPath.
    #
    # * This has a hard requirement: the usages of a page must share a common context prefix
    #
    # * e.g. let's say that page boolean is a Boolean answer page and page string is a String answer page:
    # { do: ..., [choice, { Y: [boolean, string], N: [boolean, string, moreInfo] }}  is valid
    # { do:..., [choice, { Y: [string, boolean], N: [string, moreInfo, boolean] }}  is valid
    # { do: ..., [choice, { Y: [string, boolean], N: [boolean, string] }}            is not
    #
    # This is because the string page appears at two paths:
    # * JsPath / Y / index / string
    # * JsPath / N / boolean / string
    #
    # In one case, string is used as part of an add-to-list entry, and in another it's part of an optional subjourney.
    #
    # The routes would look like this for the first case:
    # GET  /choice/:choice/string        StringController.onPageLoad(choice: Choice, mode: Mode = NormalMode)
    # POST /choice/:choice/string        StringController.onSubmit(choice: Choice, mode: Mode = NormalMode)
    # GET  /choice/:choice/change-string StringController.onPageLoad(choice: Choice, mode: Mode = CheckMode)
    # POST /choice/:choice/change-string StringController.onSubmit(choice: Choice, mode: Mode = CheckMode)

    # The routes would look like this for the second case:
    # GET  /choice/:choice/:index/string        StringController.onPageLoad(choice: Choice, index: Int, mode: Mode = NormalMode)
    # POST /choice/:choice/:index/string        StringController.onSubmit(choice: Choice, index: Int, mode: Mode = NormalMode)
    # GET  /choice/:choice/:index/change-string StringController.onPageLoad(choice: Choice, index: Int, mode: Mode = CheckMode)
    # POST /choice/:choice/:index/change-string StringController.onSubmit(choice: Choice, index: Int, mode: Mode = CheckMode)
    #
    # e.g. /choice/Y/1/string
    #
    # However, this exposes a user answer via the routes, which is not appropriate in many cases.
    # It's definitely debatable though - e.g. you could already argue that user answers are exposed via the appearance of optional page routes in logs.
    #
  }
}