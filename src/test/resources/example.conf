serviceName: simple-journey

rootPages {
  index {viewRoute = "/"}
  beforeYouBegin {}
  checkYourAnswers {withDefaultController = false}
}

models {
  TaxRegime: [SA, VAT]
  AuditEvent: [
    {auditType: String},
    {description: String},
    {expectedGoLiveDate: LocalDate},
    {expectedDecommissioningDate: {Option: LocalDate}}
  ]
}

journeys {
  submission {
    pages {
      cipAssessmentTicket {
        answerType = String
      }
      cipAssessmentPage {
        answerType = String
      }
      serviceName {
        answerType = String
      }
      serviceDescription {
        answerType = String
      }
      dataDomain {
        answerType = String
      }
      addAnotherDataDomain {
        answerType = Boolean
      }
      addATaxRegime {
        answerType = Boolean
      }
      taxRegime {
        answerType = TaxRegime
      }
      addAnotherTaxRegime {
        answerType = Boolean
      }
      auditProvider {
        answerType = String
      }
      auditSource {
        answerType = String
      }
      auditEvent {
        answerType = AuditEvent
      }
      addAnotherAuditEvent {
        answerType = Boolean
      }
      addAnotherAuditSource {
        answerType = Boolean
      }
    }

    journey = [
      cipAssessmentTicket,
      cipAssessmentPage,
      serviceName,
      serviceDescription,
      {do: dataDomain, while: addAnotherDataDomain, as: dataDomains},
      {if: addATaxRegime, then: {do: taxRegime, while: addAnotherTaxRegime, as: taxRegimes}},
      auditProvider,
      {do: [auditSource, {do: auditEvent, while: addAnotherAuditEvent, as: auditEvents}], while: addAnotherAuditSource, as: auditSources},
      checkYourAnswers
    ]
  }
}