serviceName = "platform-readiness-frontend"

basePackage = uk.gov.hmrc.pra

indexPage = "index"

rootPages {
  index {}
}

models {
  BlaBla: [
    {a: {List: Int}}
    {b: {Array: Byte}}
    {c: {Map: [String, BlaBla]}}
    {d: Instant}
    {e: java.util.Date}
  ]
}

journeys {
  submission {
    name = "Submission"
    startPage = "beforeYouStart"
    pages {
      beforeYouStart {
        viewClass = views.html.SubmissionStartView
        nextPage = "serviceUrl"
      }
      serviceUrl {
        changeRoute = "/edit-service-url"
        answerType: Int
        controllerClass = uk.gov.hmrc.pra.ServiceUrlController
      }
    }
  }
}